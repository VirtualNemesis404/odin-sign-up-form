<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <img src="./assets/bg-image.jpg" alt="Background Image">
            <div class="overlay"></div>
            <div class="overlay-section">
                <div class="logo">
                    Logo
                </div>
                <p>ODIN</p>
            </div>
            <div class="credits">
                <p>Photo by Halie West on Unsplash</p>
            </div>
        </div>
        <div class="form-section">
            <div class="para">
                <p>
                    This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. Sign up now to get started.
                </p>
                <p>
                    You know you want to.   
                </p>
            </div>
            <form action="" method="post">
                <div class="registration-form">
                    <h3>Let's do this!</h3>
                    <fieldset>      
                            <div class="input">
                                <label for="first_name">First Name</label>
                                <input type="text" id="first_name" name="first_name" placeholder="Thor" required>
                            </div>
                            <div class="input">
                                <label for="last_name">Last Name</label>
                                <input type="text" id="last_name" name="last_name" placeholder="Odinson" required>
                            </div>
                            <div class="input">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="thorodinson@gmail.com" required>
                            </div>
                            <div class="input">
                                <label for="phone">Phone Number</label>
                                <input type="text" id="phone" name="phone" placeholder="9876543210" required pattern="^\d{10}$">
                            </div>
                            <div class="input">
                                <label for="password">Password</label>
                                <input type="password" id="password" name="password" required minlength="8">
                            </div>
                            <div class="input">
                                <label for="confirm_password">Confirm Password</label>
                                <input type="password" id="confirm_password" name="confirm_password" required minlength="8">
                            </div>
                    </fieldset>
                </div>

                <button class="form-btn">Create Account</button>
            </form>
            <div class="login-form">
                <p>Already have an account?</p>
                <a href="">Log in</a>
            </div>
        </div>
    </div>
</body>
</html>
